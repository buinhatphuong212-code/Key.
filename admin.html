<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | RED KEY STORE</title><link rel="stylesheet" href="assets/style.css"></head><body><header><a class="brand" href="index.html">RED<span>KEY</span> STORE</a><nav><a href="index.html">Cửa hàng</a><a href="history.html">Lịch sử</a><a href="#" onclick="logout()">Đăng xuất</a></nav></header><main><p class="eyebrow">CONTROL ROOM</p><h1>Quản trị</h1><p class="muted">Chỉ tài khoản được cấp quyền admin trong database mới sử dụng được các chức năng dưới đây.</p><section class="panel"><h2>Yêu cầu nạp tiền</h2><div id="pendingDeposits">Đang tải...</div></section><section class="panel"><h2>Thêm sản phẩm</h2><form id="productForm"><label>Tên sản phẩm<input id="pName" maxlength="100" required></label><label>Mô tả<input id="pDescription" maxlength="500"></label><label>Giá (VND)<input id="pPrice" type="number" min="1000" required></label><button class="btn">Tạo sản phẩm</button></form></section><section class="panel"><h2>Thêm key vào kho</h2><form id="keyForm"><label>ID sản phẩm<input id="keyProduct" type="number" min="1" required></label><label>Key (mỗi lần một key)<textarea id="keyValue" maxlength="500" required></textarea></label><button class="btn">Thêm key</button></form><p class="muted">Key chỉ được trả về người mua sau khi RPC mua hàng hoàn tất.</p></section><p id="adminMessage" class="notice"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>initAdmin();document.querySelector('#productForm').addEventListener('submit',createProduct);document.querySelector('#keyForm').addEventListener('submit',addKey);</script></body></html>
